<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="Index.html" class="logo-text">ToDoApp</a>

        </nav>
    </header>
    <main class="todo-wrapper">
<section class="todo-card">
    <h2>MY ToDo List</h2>
    <div class="add-task">
        <input type="text" id="taskInput" placeholder="Enter a Task">
        <button id="addTaskBtn" class="btn primary">Add Task</button>

    </div> <br>
    <ul id="taskList"></ul>
    <button id="clearAllBtn" class="Btn danger">Delete All</button>

</section>
    </main>
    <script src="app.js"></script>
</body>
</html>
